[package]
name = "tailscale-screenshot"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal"] }
serde_json = "1"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
